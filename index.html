<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ماڵی عەلاقی</title>
<meta name="theme-color" content="#0D3B66">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-base:#0A2540;
    --navy-primary:#0D3B66;
    --navy-grad-1:#0B1E36;
    --navy-grad-2:#134074;
    --accent-purple:#5B2D8C;
    --accent-purple-dark:#4A2270;
    --white:#FFFFFF;
    --card-bg:#FFFFFF;
    --page-bg:#F4F6F9;
    --card-border:#E7ECF2;
    --text:#0A2540;
    --muted:#7C8CA0;
    --danger:#DC2626;
    --green:#16A34A;
    --green-dark:#0F7A38;
    --radius:20px;
    --shadow:0 4px 16px rgba(10,37,64,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Kufi Arabic','Segoe UI',sans-serif;
    background:var(--page-bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:88px; /* clears the fixed bottom nav */
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  /* ===== Header (title + icon only — no menu/cart buttons here) ===== */
  .topbar{
    background:linear-gradient(135deg,var(--navy-grad-1),var(--navy-grad-2));
    padding:18px 16px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:12px;
    position:sticky;
    top:0;
    z-index:40;
    box-shadow:0 2px 14px rgba(10,37,64,0.35);
  }
  .brand{display:flex;align-items:center;gap:10px;color:#fff;}
  .brand-name{font-size:22px;font-weight:800;letter-spacing:.2px;}
  .brand-icon{
    width:42px;height:42px;flex-shrink:0;
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:13px;
    display:flex;align-items:center;justify-content:center;
  }

  /* ===== Pages ===== */
  .page{display:none;}
  .page.active{display:block;}

  /* ===== Search (Home page) ===== */
  .subbar{max-width:1100px;margin:0 auto;padding:16px 16px 0;}
  .search-wrap{position:relative;}
  .search-wrap input{
    width:100%;
    padding:14px 46px 14px 16px;
    border-radius:16px;
    border:1px solid var(--card-border);
    background:#fff;
    font-size:15px;outline:none;
    box-shadow:var(--shadow);
  }
  .search-wrap input:focus{border-color:var(--navy-primary);}
  .search-wrap svg{position:absolute;top:50%;right:16px;transform:translateY(-50%);color:var(--muted);pointer-events:none;}

  /* ===== Section tabs ===== */
  .tabs{max-width:1100px;margin:14px auto 0;padding:0 16px;display:flex;gap:10px;}
  .tab-btn{
    flex:1;padding:13px 10px;border-radius:18px;
    border:1px solid var(--card-border);background:#fff;
    color:var(--navy-primary);font-weight:700;font-size:14.5px;
  }
  .tab-btn.active{background:var(--navy-primary);color:#fff;border-color:var(--navy-primary);}

  /* ===== Category chips ===== */
  .cat-scroll-wrap{max-width:1100px;margin:14px auto 0;padding:0 16px;}
  .cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
  .cat-scroll::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0;padding:10px 20px;border-radius:999px;
    border:1px solid var(--card-border);background:#fff;
    color:var(--text);font-size:13.5px;font-weight:700;white-space:nowrap;
  }
  .cat-chip.active{background:var(--navy-primary);border-color:var(--navy-primary);color:#fff;}

  /* ===== Grid ===== */
  .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px;}
  @media (min-width:600px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media (min-width:900px){ .grid{grid-template-columns:repeat(4,1fr);} }

  .card{
    background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;
  }
  .card-media{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#fff;}
  .card-media img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .card-admin-actions{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px;z-index:5;}
  .mini-btn{
    width:30px;height:30px;border-radius:999px;border:none;
    background:rgba(255,255,255,0.92);display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  .mini-btn.edit{color:var(--navy-primary);}
  .mini-btn.delete{color:var(--danger);}
  .card-title{margin-top:10px;font-size:14px;font-weight:700;color:var(--text);line-height:1.4;min-height:20px;}
  .card-badge-row{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;margin-top:4px;}
  .card-badge-row svg{flex-shrink:0;}
  .card-bottom-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;}
  .card-price{font-size:17px;font-weight:800;color:var(--navy-primary);white-space:nowrap;}
  .card-price.offer{color:var(--danger);}
  .card-add-btn{
    width:40px;height:40px;flex-shrink:0;border-radius:13px;border:none;
    background:var(--accent-purple);color:#fff;font-size:22px;font-weight:700;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .card-add-btn:active{background:var(--accent-purple-dark);}

  .empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state svg{margin-bottom:10px;color:var(--card-border);}
  .empty-state p{font-size:16px;font-weight:600;}

  /* ===== Cart page ===== */
  .page-inner{max-width:700px;margin:0 auto;padding:18px 16px;}
  .page-heading{font-size:20px;font-weight:800;color:var(--navy-primary);margin:0 0 16px;}
  .cart-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px dashed var(--card-border);}
  .cart-item img{width:58px;height:58px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--page-bg);}
  .cart-item-info{flex:1;min-width:0;}
  .cart-item-name{font-size:14.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cart-item-price{font-size:13px;color:var(--muted);margin-top:2px;}
  .qty-stepper{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .qty-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--card-border);background:#fff;color:var(--navy-primary);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;}
  .qty-val{min-width:20px;text-align:center;font-weight:700;}
  .cart-remove-btn{width:32px;height:32px;border-radius:999px;border:none;background:var(--page-bg);color:var(--danger);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cart-empty{text-align:center;color:var(--muted);padding:50px 10px;font-size:14.5px;}
  .cart-total-row{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;font-weight:800;font-size:17px;border-top:1px solid var(--card-border);margin-top:6px;}

  .btn{width:100%;padding:14px;border-radius:14px;border:none;font-weight:700;font-size:15px;}
  .btn-primary{background:var(--navy-primary);color:#fff;}
  .btn-primary:disabled{opacity:0.6;}
  .btn-secondary{background:#fff;border:1px solid var(--card-border);color:var(--navy-primary);}
  .btn-whatsapp{background:var(--green);color:#fff;}
  .btn-whatsapp:disabled{opacity:0.6;}
  .btn-danger{background:#fff;border:1px solid var(--danger);color:var(--danger);}

  /* ===== Account page ===== */
  .lang-switch-row{display:flex;gap:10px;margin-bottom:22px;}
  .lang-btn{flex:1;padding:13px;border-radius:14px;border:1px solid var(--card-border);background:#fff;color:var(--text);font-weight:700;font-size:14.5px;}
  .lang-btn.active{background:var(--navy-primary);border-color:var(--navy-primary);color:#fff;}

  .account-card{background:#fff;border:1px solid var(--card-border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:18px;}
  .account-card h3{margin:0 0 14px;font-size:16px;color:var(--navy-primary);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;}
  .field input[type=text],.field input[type=number],.field input[type=url],
  .field input[type=email],.field input[type=password],.field select,.field textarea{
    width:100%;padding:12px 13px;border:1px solid var(--card-border);border-radius:11px;
    font-size:15px;outline:none;background:#fbfdff;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy-primary);background:#fff;}
  .field textarea{min-height:70px;resize:vertical;}
  .req{color:var(--danger);}
  .radio-row{display:flex;gap:10px;}
  .radio-opt{flex:1;border:1px solid var(--card-border);border-radius:11px;padding:11px;text-align:center;font-weight:700;font-size:13.5px;color:var(--muted);}
  .radio-opt.selected{background:var(--navy-primary);color:#fff;border-color:var(--navy-primary);}
  .radio-opt input{display:none;}
  .cat-row{display:flex;gap:8px;}
  .cat-row select{flex:1;}
  .cat-row button{flex-shrink:0;width:46px;border-radius:11px;border:1px solid var(--card-border);background:var(--page-bg);color:var(--navy-primary);font-size:20px;font-weight:700;}
  .img-preview{
    width:100%;aspect-ratio:16/9;border-radius:12px;background:var(--page-bg);
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;color:var(--muted);font-size:13px;
  }
  .img-preview img{width:100%;height:100%;object-fit:cover;}
  .form-actions{display:flex;gap:10px;margin-top:8px;}
  .logged-in-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
  .logged-in-email{font-size:13.5px;color:var(--muted);word-break:break-all;}

  /* ===== Sticky bottom nav ===== */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:linear-gradient(135deg,var(--navy-grad-1),var(--navy-grad-2));
    display:flex;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    z-index:50;
    box-shadow:0 -2px 14px rgba(10,37,64,0.3);
  }
  .nav-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;color:rgba(255,255,255,0.65);
    padding:6px 4px;border-radius:12px;position:relative;font-size:11.5px;font-weight:700;
  }
  .nav-btn.active{color:#fff;}
  .nav-btn .badge{
    position:absolute;top:0;left:calc(50% + 6px);
    min-width:17px;height:17px;border-radius:999px;background:var(--danger);color:#fff;
    font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;
    padding:0 4px;border:2px solid var(--navy-grad-1);
  }
</style>
</head>
<body>

<!-- ===== Header: title + icon ONLY (no menu / cart buttons) ===== -->
<header class="topbar">
  <div class="brand">
    <span class="brand-name">ماڵی عەلاقی</span>
    <span class="brand-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 21V13h6v8"/></svg>
    </span>
  </div>
</header>

<!-- ===== PAGE 1: HOME ===== -->
<div class="page active" id="pageHome">
  <div class="subbar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="گەڕان بۆ کاڵا...">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabMain" data-section="main">بەشی سەرەکی</button>
    <button class="tab-btn" id="tabOffers" data-section="offers">بەشی ئۆفەر</button>
  </div>

  <div class="cat-scroll-wrap">
    <div class="cat-scroll" id="catScroll">
      <button class="cat-chip active" data-cat="all">هەمووی</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- ===== PAGE 2: CART ===== -->
<div class="page" id="pageCart">
  <div class="page-inner">
    <h2 class="page-heading" id="cartTitle">سەبەتەی کڕین</h2>
    <div id="cartList"></div>
    <div class="cart-total-row">
      <span id="cartTotalLabel">کۆی گشتی</span>
      <span id="cartTotalValue">0 IQD</span>
    </div>
    <button type="button" class="btn btn-whatsapp" id="cartOrderWa">داواکردن لە ڕێی واتساپ</button>
  </div>
</div>

<!-- ===== PAGE 3: ACCOUNT ===== -->
<div class="page" id="pageAccount">
  <div class="page-inner">
    <h2 class="page-heading" id="accountTitle">هەژمار</h2>

    <div class="lang-switch-row">
      <button type="button" class="lang-btn active" id="langKuBtn">کوردی</button>
      <button type="button" class="lang-btn" id="langArBtn">العربية</button>
    </div>

    <!-- Guest view -->
    <div class="account-card" id="guestLoginCard">
      <h3 id="loginTitle">چوونەژوورەوەی بەڕێوەبەر</h3>
      <form id="loginForm">
        <div class="field">
          <label id="lblEmail">ئیمەیل</label>
          <input type="email" id="loginEmail" value="suhayb99@gmail.com" required autocomplete="username">
        </div>
        <div class="field">
          <label id="lblPassword">وشەی نهێنی</label>
          <input type="password" id="loginPassword" value="1234Suhayb" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="loginSubmitBtn">چوونەژوورەوە</button>
      </form>
    </div>

    <!-- Admin view -->
    <div class="account-card" id="adminSection" style="display:none;">
      <div class="logged-in-row">
        <div>
          <h3 style="margin:0;" id="loggedInLabel">چووی ژوورەوە وەک بەڕێوەبەر</h3>
          <div class="logged-in-email" id="loggedInEmail"></div>
        </div>
        <button type="button" class="btn btn-danger" id="logoutBtn" style="width:auto;padding:10px 16px;">دەرچوون</button>
      </div>
    </div>

    <div class="account-card" id="productFormCard" style="display:none;">
      <h3 id="formTitle">زیادکردنی کاڵا</h3>
      <form id="productForm">
        <div class="field">
          <label id="lblImage">لینکی وێنه (URL)</label>
          <div class="img-preview" id="imgPreview">وێنه لێرە دەردەکەوێت</div>
          <input type="url" id="fImage" placeholder="https://i.ibb.co/xxxx.jpg" required>
        </div>
        <div class="field">
          <label id="lblName">ناوی کاڵا <span class="req">*</span></label>
          <input type="text" id="fName" required>
        </div>
        <div class="field">
          <label id="lblCategory">جۆر / پۆل</label>
          <div class="cat-row">
            <select id="fCategory"></select>
            <button type="button" id="addCatBtn">+</button>
          </div>
        </div>
        <div class="field">
          <label id="lblSection">شوێنی دەرکەوتن</label>
          <div class="radio-row">
            <label class="radio-opt selected" id="optMain">
              <input type="radio" name="section" value="main" checked>
              <span id="optMainText">بەشی سەرەکی</span>
            </label>
            <label class="radio-opt" id="optOffers">
              <input type="radio" name="section" value="offers">
              <span id="optOffersText">بەشی ئۆفەر</span>
            </label>
          </div>
        </div>
        <div class="field">
          <label id="lblPrice">نرخ (IQD) <span class="req">*</span></label>
          <input type="number" id="fPrice" min="0" step="1" required>
        </div>
        <div class="field">
          <label id="lblBadge">دیاریکەری بچووک (ئارەزوومەندانە، بۆ نموونە: 24 کاتژمێر)</label>
          <input type="text" id="fBadge">
        </div>
        <div class="field">
          <label id="lblDesc">تێبینی / وردەکاری</label>
          <textarea id="fDesc"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">پاشگەزبوونەوه</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">پاشەکەوتکردن</button>
        </div>
      </form>
    </div>

    <button type="button" class="btn btn-secondary" id="addProductToggleBtn" style="display:none;">
      <span id="addProductToggleText">+ زیادکردنی کاڵای نوێ</span>
    </button>
  </div>
</div>

<!-- ===== Sticky bottom nav: Account | Cart | Home (right → left in RTL) ===== -->
<nav class="bottom-nav">
  <button class="nav-btn" id="navAccount" data-page="account">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span id="navAccountText">هەژمار</span>
  </button>
  <button class="nav-btn" id="navCart" data-page="cart">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span id="navCartText">سەبەتە</span>
    <span class="badge" id="cartBadge" style="display:none;">0</span>
  </button>
  <button class="nav-btn active" id="navHome" data-page="home">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
    <span id="navHomeText">سەرەکی</span>
  </button>
</nav>

<!-- ===== Firebase SDK (compat build, v12) ===== -->
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script>

<script>
(function(){
  "use strict";

  /* ==========================================================
     STATE — declared up top, independent of whether Firebase
     ever successfully loads. This is what keeps page-switching,
     tabs, search, and the cart fully working even if the
     database connection fails.
  ========================================================== */
  const K_LANG = 'alaqi_lang_v2';
  let lang = localStorage.getItem(K_LANG) || 'ku';
  let currentPage = 'home'; // 'home' | 'cart' | 'account'
  let currentSection = 'main';
  let currentCategory = 'all';
  let searchTerm = '';
  let editingId = null;
  let isAdmin = false;

  let productsCache = [];
  let productsLoaded = false;
  let categoriesCache = [];
  let cart = []; // [{id, name, price, image, qty}]

  const WHATSAPP_NUMBER = '9647704917319';

  const T = {
    ku: {
      tabMain:'بەشی سەرەکی', tabOffers:'بەشی ئۆفەر', allCat:'هەمووی',
      searchPlaceholder:'گەڕان بۆ کاڵا...',
      navHomeText:'سەرەکی', navCartText:'سەبەتە', navAccountText:'هەژمار',
      accountTitle:'هەژمار',
      formTitleAdd:'زیادکردنی کاڵا', formTitleEdit:'دەستکاریکردنی کاڵا',
      lblImage:'لینکی وێنه (URL)', imgPreviewText:'وێنه لێرە دەردەکەوێت',
      lblName:'ناوی کاڵا', lblCategory:'جۆر / پۆل', lblSection:'شوێنی دەرکەوتن',
      optMainText:'بەشی سەرەکی', optOffersText:'بەشی ئۆفەر',
      lblPrice:'نرخ (IQD)', lblBadge:'دیاریکەری بچووک (ئارەزوومەندانە، بۆ نموونە: 24 کاتژمێر)',
      lblDesc:'تێبینی / وردەکاری',

  function fmt(n){
    if(n === null || n === undefined || n === '') return null;
    return Number(n).toLocaleString('en-US');
  }
  function escapeHtml(str){
    if(str === undefined || str === null) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  /* ============ Broken image fallback ============ */
  const PLACEHOLDER_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="400" height="400" fill="#EAF2FB"/><g fill="none" stroke="#9DB8D2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><rect x="70" y="90" width="260" height="200" rx="16"/><circle cx="150" cy="150" r="20"/><path d="M70 250l70-70 50 50 60-80 80 100"/></g></svg>`;
  const PLACEHOLDER_IMG = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(PLACEHOLDER_SVG);
  window.handleImgError = function(el){
    el.onerror = null;
    el.src = PLACEHOLDER_IMG;
    el.style.objectFit = 'contain';
    el.style.padding = '14%';
  };

  /* ============ imgbb / ibb.co link normalizer ============ */
  function normalizeImageUrl(url){
    if(!url) return url;
    const trimmed = url.trim();
    let u;
    try{ u = new URL(trimmed); }catch(e){ return trimmed; }
    const host = u.hostname.replace(/^www\./,'');
    if(host === 'i.ibb.co') return trimmed;
    if(host === 'ibb.co') return 'https://i.ibb.co' + u.pathname + u.search;
    if(host === 'imgbb.com' && u.pathname.startsWith('/image/')){
      return 'https://i.ibb.co' + u.pathname.replace('/image', '') + u.search;
    }
    return trimmed;
  }

  /* ==========================================================
     Cart
  ========================================================== */
  function updateCartBadge(){
    const totalQty = cart.reduce((sum, it) => sum + it.qty, 0);
    const badge = document.getElementById('cartBadge');
    if(totalQty > 0){
      badge.style.display = 'flex';
      badge.textContent = totalQty > 99 ? '99+' : String(totalQty);
    } else {
      badge.style.display = 'none';
    }
  }
  function addToCart(id){
    const p = productsCache.find(x => x.id === id);
    if(!p) return;
    const existing = cart.find(it => it.id === id);
    if(existing){
      existing.qty += 1;
    } else {
      cart.push({ id: p.id, name: p.name, price: Number(p.price) || 0, image: p.image || '', qty: 1 });
    }
    updateCartBadge();
    if(currentPage === 'cart') renderCart();
  }
  function changeQty(id, delta){
    const item = cart.find(it => it.id === id);
    if(!item) return;
    item.qty += delta;
    if(item.qty <= 0){
      cart = cart.filter(it => it.id !== id);
    }
    updateCartBadge();
    renderCart();
  }
  function removeFromCart(id){
    cart = cart.filter(it => it.id !== id);
    updateCartBadge();
    renderCart();
  }
  function cartTotal(){
    return cart.reduce((sum, it) => sum + (it.price * it.qty), 0);
  }
  function renderCart(){
    const dict = T[lang];
    const list = document.getElementById('cartList');
    if(cart.length === 0){
      list.innerHTML = `<div class="cart-empty">${dict.cartEmpty}</div>`;
    } else {
      list.innerHTML = cart.map(it => `
        <div class="cart-item">
          <img src="${escapeHtml(it.image)}" referrerpolicy="no-referrer" onerror="handleImgError(this)">
          <div class="cart-item-info">
            <div class="cart-item-name">${escapeHtml(it.name)}</div>
            <div class="cart-item-price">${fmt(it.price)} ${dict.currency}</div>
          </div>
          <div class="qty-stepper">
            <button class="qty-btn" data-qty-minus="${it.id}">−</button>
            <span class="qty-val">${it.qty}</span>
            <button class="qty-btn" data-qty-plus="${it.id}">+</button>
          </div>
          <button class="cart-remove-btn" data-cart-remove="${it.id}" aria-label="remove">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>`).join('');
    }
    document.getElementById('cartTotalValue').textContent = fmt(cartTotal()) + ' ' + dict.currency;
  }
  function buildWhatsAppUrl(items, total){
    const dict = T[lang];
    const lines = items.map((it, i) => `${i+1}. ${it.name} - ${it.qty} × ${fmt(it.price)} ${dict.currency} = ${fmt(it.price*it.qty)} ${dict.currency}`);
    const header = lang === 'ku' ? 'داواکردنی کاڵا لە ماڵی عەلاقی:' : 'طلب من ماڵی عەلاقی:';
    const totalLine = (lang === 'ku' ? 'کۆی گشتی' : 'المجموع الكلي') + `: ${fmt(total)} ${dict.currency}`;
    const message = header + '\n\n' + lines.join('\n') + '\n\n' + totalLine;
    return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  }

  /* ==========================================================
     Firebase (Realtime Database + Auth)
     Resilience: every piece of pure UI wiring in this file works
     standalone. If Firebase fails to load or init, it's caught
     here and reported inline — it will NOT take down page
     switching, tabs, search, or the cart, since none of those
     depend on this block having succeeded.
  ========================================================== */
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "YOUR_DATABASE_URL", // e.g. https://your-project-default-rtdb.firebaseio.com
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  let auth = null;
  let db = null;
  let productsRef = null;
  let categoriesRef = null;
  let firebaseReady = false;

  function addProductToDb(data){
    if(!firebaseReady) return Promise.reject(new Error(T[lang].dbErrorMsg));
    return productsRef.push({ ...data, createdAt: firebase.database.ServerValue.TIMESTAMP });
  }
  function updateProductInDb(id, data){
    if(!firebaseReady) return Promise.reject(new Error(T[lang].dbErrorMsg));
    return productsRef.child(id).update(data);
  }
  function deleteProductFromDb(id){
    if(!firebaseReady) return Promise.reject(new Error(T[lang].dbErrorMsg));
    return productsRef.child(id).remove();
  }
  function addCategoryToDb(name){
    if(!firebaseReady) return Promise.reject(new Error(T[lang].dbErrorMsg));
    const safeKey = name.replace(/[.#$\[\]/]/g, '_');
    return categoriesRef.child(safeKey).set(name);
  }

  function updateAuthUI(){
    document.getElementById('guestLoginCard').style.display = isAdmin ? 'none' : 'block';
    document.getElementById('adminSection').style.display = isAdmin ? 'block' : 'none';
    document.getElementById('addProductToggleBtn').style.display = isAdmin ? 'block' : 'none';
    if(!isAdmin){
      document.getElementById('productFormCard').style.display = 'none';
    }
    if(isAdmin && auth && auth.currentUser){
      document.getElementById('loggedInEmail').textContent = auth.currentUser.email || '';
    }
  }

  try{
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.database();
    productsRef = db.ref('products');
    categoriesRef = db.ref('categories');
    firebaseReady = true;

    auth.onAuthStateChanged((user) => {
      isAdmin = !!user;
      updateAuthUI();
      renderGrid();
    });

    productsRef.on('value', (snapshot) => {
      const val = snapshot.val() || {};
      const docs = Object.keys(val).map(key => ({ id: key, ...val[key] }));
      docs.sort((a, b) => (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0));
      productsCache = docs;
      productsLoaded = true;
      renderGrid();
    }, (err) => {
      console.error('Realtime Database products error:', err);
      productsLoaded = true;
      renderGrid();
    });

    categoriesRef.on('value', (snapshot) => {
      const val = snapshot.val() || {};
      categoriesCache = Object.values(val);
      renderCatChips();
    }, (err) => {
      console.error('Realtime Database categories error:', err);
    });
  }catch(err){
    console.error('Firebase failed to initialize:', err);
    firebaseReady = false;
    productsLoaded = true; // stop showing an infinite loading state
  }

      alert(lang === 'ku' ? 'تکایە چاوەڕێ بکە، کاڵاکە هێشتا پاشەکەوت دەکرێت...' : 'يرجى الانتظار، جارٍ حفظ المنتج...');
      return;
    }
    editingId = id || null;
    const dict = T[lang];
    document.getElementById('formTitle').textContent = editingId ? dict.formTitleEdit : dict.formTitleAdd;
    const form = document.getElementById('productForm');
    form.reset();
    renderCategorySelect();
    setSection('main');
    document.getElementById('imgPreview').innerHTML = dict.imgPreviewText;

    if(editingId){
      const p = productsCache.find(x => x.id === editingId);
      if(p){
        document.getElementById('fImage').value = p.image || '';
        document.getElementById('fName').value = p.name || '';
        renderCategorySelect(p.category || '');
        setSection(p.section || 'main');

        document.getElementById('fBadge').value = p.badge || '';
        document.getElementById('fDesc').value = p.desc || '';

    goToPage('account');

  function setSection(val){
    const main = document.getElementById('optMain');
    const offers = document.getElementById('optOffers');
    main.classList.toggle('selected', val === 'main');
    offers.classList.toggle('selected', val === 'offers');
    main.querySelector('input').checked = val === 'main';
    offers.querySelector('input').checked = val === 'offers';
  }
  function updateImgPreview(){
    const raw = document.getElementById('fImage').value.trim();
    const url = normalizeImageUrl(raw);
    const box = document.getElementById('imgPreview');
    const dict = T[lang];
    if(url){
      box.innerHTML = `<img src="${escapeHtml(url)}" referrerpolicy="no-referrer" onerror="handleImgError(this)">`;
    } else {
      box.textContent = dict.imgPreviewText;
    }
  }

  async function deleteProduct(id){
    const dict = T[lang];
    if(!isAdmin){ alert(dict.pleaseLogin); return; }
    if(String(id).indexOf('temp_') === 0){
      alert(lang === 'ku' ? 'تکایە چاوەڕێ بکە، کاڵاکە هێشتا پاشەکەوت دەکرێت...' : 'يرجى الانتظار، جارٍ حفظ المنتج...');
      return;
    }
    if(!confirm(dict.confirmDelete)) return;
    try{
      await deleteProductFromDb(id);
    }catch(err){
      alert(dict.errorPrefix + err.message);
    }
  }

  document.getElementById('grid').addEventListener('click', (e) => {

    if(cartBtn){ addToCart(cartBtn.getAttribute('data-addcart')); return; }
    const editBtn = e.target.closest('[data-edit]');
    if(editBtn){ openForm(editBtn.getAttribute('data-edit')); return; }
    const delBtn = e.target.closest('[data-delete]');
    if(delBtn){ deleteProduct(delBtn.getAttribute('data-delete')); return; }
  });

  // Cart page actions (delegated)
  document.getElementById('cartList').addEventListener('click', (e) => {
    const plus = e.target.closest('[data-qty-plus]');
    if(plus){ changeQty(plus.getAttribute('data-qty-plus'), 1); return; }
    const minus = e.target.closest('[data-qty-minus]');
    if(minus){ changeQty(minus.getAttribute('data-qty-minus'), -1); return; }
    const rm = e.target.closest('[data-cart-remove]');
    if(rm){ removeFromCart(rm.getAttribute('data-cart-remove')); return; }
  });
  document.getElementById('cartOrderWa').addEventListener('click', () => {
    if(cart.length === 0) return;
    const url = buildWhatsAppUrl(cart, cartTotal());
    window.open(url, '_blank');
  });

  // Language switch (Account page)
  document.getElementById('langKuBtn').addEventListener('click', () => {
    lang = 'ku'; applyLang(); renderGrid(); renderCart();
  });
  document.getElementById('langArBtn').addEventListener('click', () => {
    lang = 'ar'; applyLang(); renderGrid(); renderCart();
  });

  // Login / Logout
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const dict = T[lang];
    if(!firebaseReady || !auth){
      alert(dict.dbErrorMsg);
      return;
    }
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginSubmitBtn');
    btn.disabled = true;
    auth.signInWithEmailAndPassword(email, password)
      .catch((err) => {
        console.error('Login error:', err);
        alert(dict.loginError);
      })
      .finally(() => { btn.disabled = false; });
  });
  document.getElementById('logoutBtn').addEventListener('click', () => {
    if(auth) auth.signOut();
  });

  // Add-product toggle button (Account page)
  document.getElementById('addProductToggleBtn').addEventListener('click', () => {
    const card = document.getElementById('productFormCard');
    if(card.style.display === 'block'){
      closeForm();
    } else {
      openForm(null);
    }
  });
  document.getElementById('cancelBtn').addEventListener('click', closeForm);
  document.getElementById('optMain').addEventListener('click', () => setSection('main'));
  document.getElementById('optOffers').addEventListener('click', () => setSection('offers'));
  document.getElementById('fImage').addEventListener('input', updateImgPreview);

  document.getElementById('addCatBtn').addEventListener('click', async () => {
    const dict = T[lang];
    const raw = prompt(dict.newCatPrompt);
    const name = raw ? raw.trim() : '';
    if(!name) return;
    const btn = document.getElementById('addCatBtn');
    btn.disabled = true;
    try{
      await addCategoryToDb(name);
      if(!categoriesCache.includes(name)){
        categoriesCache = [...categoriesCache, name];
      }
      renderCategorySelect(name);
      renderCatChips();
    }catch(err){
      alert(dict.errorPrefix + err.message);
    }finally{
      btn.disabled = false;
    }
  });

  document.getElementById('productForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const dict = T[lang];
    if(!isAdmin){ alert(dict.pleaseLogin); return; }
    const section = document.querySelector('input[name="section"]:checked').value;
    const data = {
      name: document.getElementById('fName').value.trim(),
      image: normalizeImageUrl(document.getElementById('fImage').value.trim()),
      category: document.getElementById('fCategory').value,
      section: section,
      price: Number(document.getElementById('fPrice').value) || 0,
      badge: document.getElementById('fBadge').value.trim(),
      desc: document.getElementById('fDesc').value.trim()
    };
    if(!data.name || !data.price){
      alert(dict.errorPrefix + (lang === 'ku' ? 'ناو و نرخ پێویستن' : 'الاسم والسعر مطلوبان'));
      return;
    }

    const isEditing = !!editingId;
    const targetId = editingId;
    let previousEntry = null;
    let tempId = null;

    // Optimistic UI update — reflect the change instantly, don't wait on the network
    if(isEditing){
      const idx = productsCache.findIndex(p => p.id === targetId);
      if(idx > -1){
        previousEntry = { ...productsCache[idx] };
        productsCache = productsCache.map(p => p.id === targetId ? { ...p, ...data } : p);
      }
    } else {
      tempId = 'temp_' + Date.now() + '_' + Math.random().toString(16).slice(2);
      productsCache = [{ id: tempId, ...data }, ...productsCache];
    }
    setActiveSection(section);
    closeForm();

    // Sync to the database in the background; roll back only if it actually fails
    const request = isEditing ? updateProductInDb(targetId, data) : addProductToDb(data);
    request.catch((err) => {
      if(isEditing && previousEntry){
        productsCache = productsCache.map(p => p.id === targetId ? previousEntry : p);
      } else if(tempId){
        productsCache = productsCache.filter(p => p.id !== tempId);
      }
      renderGrid();
      alert(dict.errorPrefix + err.message);
    });
  });

  /* ============ Init ============ */
  applyLang();
  setActiveSection('main');
  renderGrid();
  updateCartBadge();
  goToPage('home');
})();
</script>
</body>
</html>
